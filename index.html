<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios desde API</title>
    <style>
        /* Unos estilos básicos para que no se vea plano */
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .error-state { color: red; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h1>Información de Usuarios</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo Electrónico</th>
                <th>Compañía</th>
            </tr>
        </thead>
        <tbody id="Contenido">
            <tr>
                <td colspan="4">Cargando datos de los usuarios...</td>
            </tr>
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
